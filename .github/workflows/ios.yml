name: iOS build
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: iOS
        run: xcodegen generate
      - name: Build unsigned device app
        working-directory: iOS
        run: xcodebuild -project MinimalChat.xcodeproj -scheme MinimalChat -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        working-directory: iOS
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MinimalChat.app Payload/
          zip -qry MinimalChat-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: MinimalChat-unsigned
          path: iOS/MinimalChat-unsigned.ipa
      - name: Build and launch in iOS simulator
        timeout-minutes: 20
        working-directory: iOS
        run: |
          xcodebuild -project MinimalChat.xcodeproj -scheme MinimalChat -configuration Debug -sdk iphonesimulator -derivedDataPath sim-build CODE_SIGNING_ALLOWED=NO build
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"].startswith("iPhone") and x["isAvailable"]))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" sim-build/Build/Products/Debug-iphonesimulator/MinimalChat.app
          xcrun simctl launch "$DEVICE" com.example.minimalchat
          sleep 5
          xcrun simctl io "$DEVICE" screenshot simulator.png
          xcodebuild test -project MinimalChat.xcodeproj -scheme MinimalChat -destination "id=$DEVICE" -derivedDataPath sim-build -only-testing:MinimalChatUITests CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Simulator-screenshot
          path: iOS/simulator.png
          if-no-files-found: ignore


